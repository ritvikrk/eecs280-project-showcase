<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Seam carving algorithm</title>
  <desc id="desc">An energy grid highlights a low-cost connected vertical seam that is removed to resize an image.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#a78bfa"/></marker></defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg2)"/>
  <text x="60" y="66" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Content-Aware Image Resizing</text>
  <text x="60" y="98" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="17">Dynamic programming finds a connected path with minimum visual energy</text>
  <g transform="translate(72 142)">
    <rect width="368" height="284" rx="18" fill="#0f172a" stroke="#475569"/>
    <g stroke="#334155" stroke-width="2">
      <path d="M46 20v244M92 20v244M138 20v244M184 20v244M230 20v244M276 20v244M322 20v244"/>
      <path d="M20 61h328M20 102h328M20 143h328M20 184h328M20 225h328"/>
    </g>
    <g fill="#1e293b"><rect x="20" y="20" width="46" height="41"/><rect x="184" y="102" width="46" height="41"/><rect x="276" y="184" width="46" height="41"/></g>
    <polyline points="161,40 115,81 161,122 161,163 207,204 161,245" fill="none" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fecdd3"><circle cx="161" cy="40" r="6"/><circle cx="115" cy="81" r="6"/><circle cx="161" cy="122" r="6"/><circle cx="161" cy="163" r="6"/><circle cx="207" cy="204" r="6"/><circle cx="161" cy="245" r="6"/></g>
    <text x="20" y="320" fill="#fda4af" font-family="Arial, sans-serif" font-size="17" font-weight="700">Minimum-energy seam</text>
  </g>
  <path d="M485 284h110" stroke="#a78bfa" stroke-width="5" marker-end="url(#a2)"/>
  <g transform="translate(635 142)" font-family="Arial, sans-serif">
    <rect width="493" height="284" rx="18" fill="#0f172a" stroke="#475569"/>
    <g transform="translate(34 28)">
      <circle cx="25" cy="24" r="22" fill="#4f46e5"/><text x="18" y="31" fill="white" font-size="20" font-weight="700">1</text><text x="67" y="31" fill="#f8fafc" font-size="20" font-weight="700">Measure pixel energy</text>
      <circle cx="25" cy="83" r="22" fill="#6366f1"/><text x="18" y="90" fill="white" font-size="20" font-weight="700">2</text><text x="67" y="90" fill="#f8fafc" font-size="20" font-weight="700">Accumulate minimum costs</text>
      <circle cx="25" cy="142" r="22" fill="#7c3aed"/><text x="18" y="149" fill="white" font-size="20" font-weight="700">3</text><text x="67" y="149" fill="#f8fafc" font-size="20" font-weight="700">Backtrack the best path</text>
      <circle cx="25" cy="201" r="22" fill="#8b5cf6"/><text x="18" y="208" fill="white" font-size="20" font-weight="700">4</text><text x="67" y="208" fill="#f8fafc" font-size="20" font-weight="700">Remove and repeat</text>
    </g>
  </g>
  <text x="72" y="476" fill="#818cf8" font-family="Arial, sans-serif" font-size="16">Dynamic programming · image matrices · backtracking · modular testing</text>
</svg>

