<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Statistics processing pipeline</title>
  <desc id="desc">A data file flows through parsing, filtering, statistical calculations, and a report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Statistical Analysis Pipeline</text>
  <text x="60" y="98" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">From raw observations to a concise, testable report</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(60 145)"><rect width="220" height="170" rx="20" fill="#1e293b" stroke="#334155"/><text x="28" y="48" fill="#93c5fd" font-size="18" font-weight="700">INPUT</text><text x="28" y="86" fill="#f8fafc" font-size="23" font-weight="700">Tabular data</text><text x="28" y="120" fill="#cbd5e1" font-size="16">Values + criteria</text><path d="M28 140h145" stroke="#475569" stroke-width="3"/><path d="M28 152h115" stroke="#475569" stroke-width="3"/></g>
    <g transform="translate(350 145)"><rect width="220" height="170" rx="20" fill="#1e293b" stroke="#334155"/><text x="28" y="48" fill="#86efac" font-size="18" font-weight="700">TRANSFORM</text><text x="28" y="86" fill="#f8fafc" font-size="23" font-weight="700">Filter</text><text x="28" y="120" fill="#cbd5e1" font-size="16">Select a cohort</text><circle cx="172" cy="92" r="30" fill="none" stroke="#22c55e" stroke-width="7"/><path d="M193 114l20 20" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/></g>
    <g transform="translate(640 145)"><rect width="220" height="170" rx="20" fill="#1e293b" stroke="#334155"/><text x="28" y="48" fill="#fcd34d" font-size="18" font-weight="700">COMPUTE</text><text x="28" y="86" fill="#f8fafc" font-size="23" font-weight="700">Statistics</text><text x="28" y="120" fill="#cbd5e1" font-size="16">Mean · stdev · percentile</text><path d="M31 147l38-24 34 10 36-44 45 23" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(930 145)"><rect width="210" height="170" rx="20" fill="#1e293b" stroke="#334155"/><text x="28" y="48" fill="#c4b5fd" font-size="18" font-weight="700">OUTPUT</text><text x="28" y="86" fill="#f8fafc" font-size="23" font-weight="700">Report</text><text x="28" y="120" fill="#cbd5e1" font-size="16">Clear summary</text><rect x="151" y="71" width="31" height="58" rx="4" fill="#8b5cf6"/><rect x="111" y="91" width="31" height="38" rx="4" fill="#7c3aed"/><rect x="71" y="105" width="31" height="24" rx="4" fill="#6d28d9"/></g>
  </g>
  <g stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"><path d="M292 230h42"/><path d="M582 230h42"/><path d="M872 230h42"/></g>
  <text x="60" y="374" fill="#64748b" font-family="Arial, sans-serif" font-size="16">C++ · STL vectors · numerical methods · unit testing</text>
</svg>

